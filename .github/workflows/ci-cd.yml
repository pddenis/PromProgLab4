name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake g++ curl

      - name: Configure project
        run: |
          cmake -B build -G Ninja

      - name: Build project
        run: |
          cmake --build build

      - name: Run unit tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Run integration tests
        run: |
          chmod +x ./tests/integration_test.sh

          ./build/app &
          PID=$!

          sleep 3

          curl --fail http://localhost:8080/health

          bash ./tests/integration_test.sh

          kill $PID

      - name: Run static analysis
        run: |
          clang-tidy src/main.cpp -- -I.

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Convert repository name to lowercase
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ env.REPO_LOWER }}:latest .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ env.REPO_LOWER }}:latest

  deploy-staging:
    needs: docker-build-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Run staging container
        run: |
          docker run -d --name staging-app -p 8080:8080 ghcr.io/${{ env.REPO_LOWER }}:latest

          sleep 5

          curl --fail http://localhost:8080/health

      - name: Save logs
        run: |
          docker logs staging-app > staging_logs.txt

      - name: Save metrics
        run: |
          curl http://localhost:8080/metrics > staging_metrics.txt

      - name: Upload staging logs
        uses: actions/upload-artifact@v4
        with:
          name: staging-logs
          path: staging_logs.txt

      - name: Upload staging metrics
        uses: actions/upload-artifact@v4
        with:
          name: staging-metrics
          path: staging_metrics.txt

  notification:
    needs:
      - build-and-test
      - docker-build-push
      - deploy-staging

    runs-on: ubuntu-latest

    steps:
      - name: Create report
        run: |
          echo "Repository: ${{ github.repository }}" > report.txt
          echo "Actor: ${{ github.actor }}" >> report.txt
          echo "Run number: ${{ github.run_number }}" >> report.txt
          echo "Status: success" >> report.txt
          echo "Date: $(date)" >> report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: notification-report
          path: report.txt
