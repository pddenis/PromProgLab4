name: Rollback

on:
  workflow_dispatch:

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create rollback log
        run: |
          echo "Rollback completed successfully" > rollback_logs.txt
          echo "Repository: ${{ github.repository }}" >> rollback_logs.txt
          echo "User: ${{ github.actor }}" >> rollback_logs.txt
          echo "Date: $(date)" >> rollback_logs.txt

      - name: Upload rollback logs
        uses: actions/upload-artifact@v4
        with:
          name: rollback-logs
          path: rollback_logs.txt
